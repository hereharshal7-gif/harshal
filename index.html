<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIKSITBHARAT AI – App</title>
<style>
:root{--bg:#080c16;--s:#0e1424;--l:rgba(255,255,255,.1);--t:#eef2fb;--m:#97a3bf;--p:#5b8cff;--q:#a86bff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.6 Inter,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--l);gap:10px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.5px}.logo b{background:linear-gradient(100deg,var(--p),var(--q));-webkit-background-clip:text;background-clip:text;color:transparent}
button,input{font:inherit}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:600;color:#fff;background:linear-gradient(120deg,var(--p),var(--q));cursor:pointer}
.btn.o{background:transparent;border:1px solid var(--l);color:var(--t)}
#auth{margin:auto;width:min(380px,92vw);background:var(--s);border:1px solid var(--l);border-radius:18px;padding:28px}
#auth h2{margin:0 0 16px}input{width:100%;padding:12px;margin-bottom:12px;border-radius:10px;border:1px solid var(--l);background:var(--bg);color:var(--t)}
#app{display:none;flex:1;min-height:0;flex-direction:column}
#msgs{flex:1;overflow-y:auto;padding:20px;max-width:820px;width:100%;margin:0 auto}
.m{padding:12px 16px;border-radius:14px;margin-bottom:12px;max-width:88%;white-space:pre-wrap}
.u{margin-left:auto;background:linear-gradient(120deg,var(--p),var(--q))}.a{background:var(--s);border:1px solid var(--l)}
form{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--l);max-width:820px;width:100%;margin:0 auto}
form input{margin:0;flex:1}.info{font-size:.8rem;color:var(--m)}#err{color:#ff7a7a;font-size:.85rem;margin-top:8px}
#admin{display:none;padding:16px 20px;border-top:1px solid var(--l);font-size:.85rem;overflow:auto;max-height:30vh}
</style></head><body>
<header><span class="logo">VIKSIT<b>BHARAT</b> AI</span><span class="info" id="stat"></span>
<span id="acts" style="display:none"><button class="btn o" onclick="up('pro')">Upgrade Pro</button> <button class="btn o" onclick="up('business')">Business</button> <button class="btn o" id="adm" style="display:none" onclick="admin()">Admin</button> <button class="btn o" onclick="logout()">Log out</button></span></header>
<div id="auth"><h2 id="ttl">Log in</h2><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
<button class="btn" style="width:100%" onclick="go()">Continue</button><p class="info" style="margin-bottom:0">New here? <a href="#" onclick="mode();return false" id="sw" style="color:var(--p)">Create an account</a></p><div id="err"></div></div>
<div id="app"><div id="msgs"></div><div id="admin"></div><form onsubmit="send(event)"><input id="q" placeholder="Ask anything…" autocomplete="off"><button class="btn">Send</button></form></div>
<script>
var T=localStorage.getItem('vk'),H=[],signup=false;
function $(i){return document.getElementById(i)}
function mode(){signup=!signup;$('ttl').textContent=signup?'Create account':'Log in';$('sw').textContent=signup?'Log in instead':'Create an account'}
async function api(p,b,m){var r=await fetch('/api/'+p,{method:m||(b?'POST':'GET'),headers:{'Content-Type':'application/json','Authorization':'Bearer '+(T||'')},body:b?JSON.stringify(b):undefined});
var j=await r.json().catch(function(){return{}});if(!r.ok)throw new Error(j.detail||'Something went wrong');return j}
async function go(){$('err').textContent='';try{var j=await api(signup?'signup':'login',{email:$('em').value,password:$('pw').value});T=j.token;localStorage.setItem('vk',T);boot()}catch(e){$('err').textContent=e.message}}
function logout(){localStorage.removeItem('vk');location.reload()}
async function boot(){try{var u=await api('me');$('auth').style.display='none';$('app').style.display='flex';$('acts').style.display='inline';
$('adm').style.display=u.admin?'inline-block':'none';$('stat').textContent=u.email+' · '+u.plan.toUpperCase()+' · '+u.used+'/'+u.limit+' today';
if(!H.length)add('a','Namaste! Ask me anything: coding, writing, business, analysis. Hindi, English or Hinglish.')}catch(e){T=null}}
function add(c,t){var d=document.createElement('div');d.className='m '+c;d.textContent=t;$('msgs').appendChild(d);$('msgs').scrollTop=1e9;return d}
async function send(e){e.preventDefault();var t=$('q').value.trim();if(!t)return;$('q').value='';add('u',t);H.push({role:'user',text:t});var w=add('a','Thinking…');
try{var j=await api('chat',{messages:H});w.textContent=j.text;H.push({role:'model',text:j.text});boot()}catch(x){w.textContent=x.message;H.pop()}}
async function up(p){try{var j=await api('checkout',{plan:p});location.href=j.url}catch(e){alert(e.message)}}
async function admin(){var a=$('admin');if(a.style.display=='block'){a.style.display='none';return}try{var r=await api('admin/users');
a.innerHTML='<b>'+r.length+' users</b><br>'+r.map(function(x){return x.email+' · '+x.plan+' · '+x.messages+' msgs · joined '+x.created}).join('<br>');a.style.display='block'}catch(e){alert(e.message)}}
if(T)boot();
</script></body></html>
